<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0d1117">
  <title>Mirror-AI</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="app">
    <!-- Header -->
    <div class="header">
      <h1>Mirror-AI</h1>
      <div class="status-text" id="status-text">
        <div class="status-dot" id="status-dot"></div>
        <span>Connecting...</span>
      </div>
    </div>

    <!-- Messages -->
    <div class="messages" id="messages">
      <div class="empty-state" id="empty-state">
        <h2>Mirror-AI</h2>
        <p>Send a prompt to Claude Code running on your Mac — from anywhere.</p>
      </div>
    </div>

    <!-- Input -->
    <div class="input-area">
      <textarea id="input" rows="1" placeholder="Send a prompt..." autocomplete="off" autocorrect="on" spellcheck="true"></textarea>
      <button class="send-btn" id="send-btn">&#9650;</button>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
