app = "mirror-ai-backend"
primary_region = "iad"

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 2

[env]
  NODE_ENV = "production"
  PORT = "3000"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024

# Deploy to secondary region for failover (use: fly scale count 1 --region ord)
# Regions: iad (primary), ord (failover)
# With min_machines_running = 2 and auto_start_machines = true,
# Fly will maintain HA across available regions.
