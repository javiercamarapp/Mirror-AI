name: Deploy Mirror AI Backend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run npm audit for known vulnerabilities
        run: npm audit --audit-level=high
      - name: Check for sensitive files in repo
        run: |
          echo "Checking for potential secrets or sensitive files..."
          SENSITIVE_FILES=$(find . -maxdepth 3 -name ".env" -o -name ".env.local" -o -name "*.pem" -o -name "*.key" -o -name "credentials.json" | grep -v node_modules || true)
          if [ -n "$SENSITIVE_FILES" ]; then
            echo "WARNING: Potentially sensitive files found:"
            echo "$SENSITIVE_FILES"
            exit 1
          fi
          echo "No sensitive files detected."

  test:
    needs: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test --if-present

  deploy-production:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
